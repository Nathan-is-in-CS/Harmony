# Every Flutter project has one of these. It names your app, sets the Dart
# version it needs, and lists the packages you depend on.
# Add a package with: flutter pub add <name>
name: harmony
description: Harmony — a local practice assistant that organises local audio tracks by tempo and key for rehearsing musicians.
homepage: https://Nathan-is-in-CS.github.io/Harmony/
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.9
  # Lets you preview the app inside a phone frame while you develop in a
  # browser. It is switched off automatically in a release build.
  device_preview: ^1.3.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  audioplayers: ^6.8.1
  file_picker: ^5.2.5
  path_provider: ^2.0.14

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # Put images, fonts and sounds in assets/ and list them here, for example:
  # assets:
  #   - assets/images/
  assets:
    - docs/assets/
    - assets/
